<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amigos Chat Legal</title>

  <!-- Fonte moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <!-- Firebase compat (mantive as suas versões) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-root">
    <!-- Login -->
    <main id="login-container" class="panel login-panel" aria-live="polite">
      <div class="brand">
        <div class="logo">💬</div>
        <div>
          <h1>Amigos Chat</h1>
          <p class="muted">Converse com o pessoal — rápido e simples</p>
        </div>
      </div>

      <div class="form">
        <label for="username" class="sr-only">Nome de usuário</label>
        <input id="username" class="input-field" type="text" placeholder="Nome de usuário" autocomplete="username" />

        <label for="password" class="sr-only">Senha</label>
        <input id="password" class="input-field" type="password" placeholder="Senha" autocomplete="current-password" />

        <div class="actions">
          <button class="btn" onclick="fazerLogin()">Entrar / Cadastrar</button>
        </div>

        <p id="mensagem" class="mensagem" aria-atomic="true"></p>
      </div>

      <footer class="login-footer">
        <small>Design renovado • Feito para aprendizado</small>
      </footer>
    </main>

    <!-- Chat -->
    <div id="chat-container" class="chat-layout" style="display:none;">
      <!-- Sidebar -->
      <aside class="sidebar" role="navigation" aria-label="Barra lateral">
        <div class="sidebar-top">
          <div class="user-info">
            <div class="avatar">👤</div>
            <div>
              <div class="hi">Olá,</div>
              <div id="usuario-logado" class="username">Usuário</div>
            </div>
          </div>

          <button class="btn-sair" onclick="sair()" title="Sair">Sair</button>
        </div>

        <div class="panel small">
          <h4>📡 Canais</h4>
          <div class="lista-canais">
            <div class="canal-item ativo" onclick="mudarCanal('global')">🌐 Global</div>
            <div class="canal-item" onclick="mudarCanal('grupo')">👥 Grupo</div>
          </div>
        </div>

        <div class="panel small">
          <h4>🔎 Pesquisar</h4>
          <input id="pesquisa-usuario" class="input-field input-sm" placeholder="Pesquisar usuários..." />
          <div id="resultados-pesquisa" class="resultados-pesquisa" aria-live="polite"></div>
        </div>

        <div class="panel grow">
          <h4>👥 Amigos</h4>
          <div id="lista-amigos" class="lista-amigos" aria-label="Lista de amigos"></div>
        </div>

        <div class="panel">
          <h4>🔒 Privados</h4>
          <div id="lista-conversas" class="lista-conversas"></div>
        </div>
      </aside>

      <!-- Chat area -->
      <section class="chat-area" role="main">
        <header class="chat-header">
          <div>
            <h2 id="titulo-canal">💬 Chat Global</h2>
            <p id="info-canal" class="muted">Todos os usuários</p>
          </div>
          <div class="header-actions">
            <!-- espaço para botões futuros -->
          </div>
        </header>

        <div id="mensagens" class="mensagens-container" aria-live="polite" aria-label="Mensagens do chat"></div>

        <div class="composer">
          <input id="mensagem-input" class="input-field" type="text" placeholder="Digite sua mensagem..." />
          <button class="btn btn-send" onclick="enviarMensagem()" title="Enviar">Enviar</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Seus scripts -->
  <script src="firebase-config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
